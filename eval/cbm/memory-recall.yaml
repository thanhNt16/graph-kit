# Memory-recall eval — frozen queries over eval/cbm/memory-fixtures/ (P3, fable consolidation).
# Scorer: scripts/memory-recall-eval.ts. Gate: hit_rate >= 0.8, zero validity violations,
# zero malformed. must_surface = id in top-5 after recall filters; must_not_surface =
# expired / superseded head / not-yet-valid must never appear.

- id: mr-01
  query: "how are benchmark axes partitioned"
  must_surface: [axis-partition]
  must_not_surface: []
  note: direct knowledge lookup

- id: mr-02
