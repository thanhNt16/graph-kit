  must_surface: [routing-lexicon]
  must_not_surface: []
  note: symbol-heavy query

- id: mr-10
  query: "expired decay threshold 0.3"
  must_surface: [decay-policy]
  must_not_surface: [old-decay-policy]
  note: matches expired text strongly — the filter, not the ranker, must hold

