apiVersion: graphkit.dev/v2
kind: Graph
metadata:
  name: valid-test
topology: diamond
inputs:
  repo_path:
    type: string
    required: true
nodes:
  scouter:
    agent: Software Architect
    model: opus
    objective: Analyze the codebase
    tools: [Read, Glob, Grep]
    depend_on: []
    evidence: [attack_surface]
  worker:
    agent: Code Reviewer
    model: sonnet
    objective: Audit assigned files
    depend_on: [scouter]
    evidence: [findings]
  synthesizer:
    agent: Software Architect
    model: opus
    objective: Synthesize findings into report
    depend_on: [worker]
    evidence: [report]
evidence:
  required_keys: [report]
