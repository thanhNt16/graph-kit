<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GraphKit Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="toolbar-title">
          <span class="brand">GraphKit</span>
          <span id="graph-name" class="graph-title"></span>
          <span id="graph-meta" class="graph-meta"></span>
        </div>
        <div class="toolbar-controls">
          <label class="ctrl">
            <span class="ctrl-label">model</span>
            <select id="filter-model" aria-label="Filter by model"></select>
          </label>
          <label class="ctrl">
            <span class="ctrl-label">agent</span>
            <select id="filter-agent" aria-label="Filter by agent"></select>
          </label>
          <label class="ctrl">
            <input type="checkbox" id="filter-loop" aria-label="Only nodes with loops" />
            <span>loop</span>
          </label>
          <label class="ctrl ctrl-check">
            <input type="checkbox" id="toggle-lanes" aria-label="Show phase lanes" checked />
            <span>phases</span>
          </label>
          <button id="reset-filters" type="button" class="btn">reset</button>
          <button id="fit" type="button" class="btn">fit</button>
        </div>
        <div class="toolbar-search">
          <input id="search" type="search" placeholder="search id, agent, objective, skill, tool…" aria-label="Search graph" />
        </div>
      </header>

      <div id="stale-banner" class="banner hidden" role="alert">
        <span id="stale-message"></span>
      </div>

      <main id="stage">
        <svg id="canvas" role="application" aria-label="Graph canvas" tabindex="-1"></svg>
        <aside id="drawer" class="drawer hidden" aria-label="Node details" aria-hidden="true">
          <div class="drawer-head">
            <span id="drawer-title" class="drawer-title"></span>
            <button id="drawer-close" type="button" class="btn" aria-label="Close drawer">&times;</button>
          </div>
          <div id="drawer-body" class="drawer-body"></div>
        </aside>
      </main>

      <div id="error-screen" class="error-screen hidden" role="alert">
        <h1>Graph viewer unavailable</h1>
        <p id="error-message"></p>
        <p id="error-path" class="error-path"></p>
      </div>
    </div>
    <script src="./dagre.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
