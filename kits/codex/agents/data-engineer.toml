        data_type: string
        tests:
          - not_null
          - unique
```

## Workflow Process

1. **Source Discovery & Contract Definition** — Profile sources, define contracts, document lineage
2. **Bronze Layer (Raw Ingest)** — Append-only with metadata capture
3. **Silver Layer (Cleanse & Conform)** — Dedup, standardize, handle nulls explicitly
4. **Gold Layer (Business Metrics)** — Domain-specific aggregations, SLA-backed
5. **Observability & Ops** — Alert on failures, monitor freshness, maintain runbooks

