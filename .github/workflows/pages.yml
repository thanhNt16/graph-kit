name: Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=graphkit-v0.2-report.html">
          <title>GraphKit</title></head><body>
          <a href="graphkit-v0.2-report.html">GraphKit v0.2 report</a> ·
          <a href="templates-and-viewer.md">Templates &amp; viewer docs</a> ·
          <a href="context-profiles.md">Context profiles</a>
          </body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
