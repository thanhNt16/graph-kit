name: Release

# Trigger only on main pushes: the publish job creates a new version tag,
# so triggering on tags too would recurse into a duplicate release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          echo "Latest tag: ${latest:-none}"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            base="${latest#v}"
            IFS='.' read -r major minor patch <<< "$base"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Next tag: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - name: Stamp version into CLI
        run: |
          ver="${next#v}"
          cat > src/version.ts <<TS
          export const APP_VERSION = "$ver";
          TS
          echo "Stamped src/version.ts -> $ver"
        env:
          next: ${{ steps.version.outputs.next }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:viewer
      - run: bun run build:bin
      - name: Build release archives
        run: |
          npm pack --pack-destination dist
          tar -C dist -czf "dist/gk-${{ matrix.target }}.tar.gz" gk
      - uses: actions/upload-artifact@v4
        with:
          name: graphkit-${{ matrix.target }}
          path: dist/gk-*.tar.gz

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        env:
          NEXT: ${{ needs.bundle.outputs.next }}
        run: |
          git tag "$NEXT" "$GITHUB_SHA"
          git push origin "$NEXT"
      - uses: actions/download-artifact@v4
        with:
          pattern: graphkit-*
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bundle.outputs.next }}
          name: ${{ needs.bundle.outputs.next }}
          generate_release_notes: true
          files: gk-*.tar.gz
