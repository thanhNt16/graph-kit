apiVersion: graphkit.dev/v1alpha1
kind: Workflow
metadata: { name: orchestrator-worker }
inputs: { objective: { type: string, required: true }, tasks: { type: array, required: true } }
limits: { max_iterations: 8, max_workers: 2 }
state:
  plan: { merge: replace }
  items: { merge: append_unique, identity: name }
  result: { merge: replace }
  evaluation: { merge: replace }
  evidence: { merge: append_unique, identity: key }
start: start
nodes:
  load-context:
    type: agent
    skill: orchestrator
    objective: "Load the objective and task list from inputs and emit a stable work item list."
    output: { schema: schemas/items.schema.json, save_as: items, evidence: [summary, items] }
  plan:
    type: agent
    skill: orchestrator
    objective: "Convert the loaded context into a concrete one-step routing plan."
    output: { schema: schemas/plan.schema.json, save_as: plan, evidence: [summary, tasks] }
  route:
    type: fanout
    from: items
    max_workers: 2
  execute-workers:
    type: agent
    skill: worker
    objective: "Process the leased work item and report evidence."
    output: { schema: schemas/result.schema.json, save_as: result, evidence: [summary, evidence] }
  join: { type: join, merge: items }
  aggregate:
    type: agent
    skill: orchestrator
    objective: "Merge the per-item results into a single structured result."
    output: { schema: schemas/result.schema.json, save_as: result, evidence: [summary, evidence] }
  verify:
    type: validator
    checks: [verify-result]
  evaluate:
    type: agent
    skill: reviewer
    objective: "Judge the aggregated result. Emit verdict passed/retry/blocked and whether human approval is required."
    output: { schema: schemas/evaluation.schema.json, save_as: evaluation, evidence: [summary, verdict, approval, evidence] }
  approve:
    type: human
    prompt: "A human gate is requested for the aggregated result. Approve or reject."
    actions: [approve, reject]
  complete: { type: graph, operation: complete-task }
  blocked: { type: graph, operation: complete-task }
edges:
  - { from: start, to: load-context }
  - { from: load-context, to: plan }
  - { from: plan, to: route }
  - { from: route, to: join }
  - { from: join, to: aggregate }
  - { from: aggregate, to: verify }
  - { from: verify, to: evaluate }
  - { from: evaluate, to: approve, when: "state.evaluation.approval == true" }
  - { from: evaluate, to: complete, when: "state.evaluation.approval == false && state.evaluation.verdict == 'passed'" }
  - { from: evaluate, to: plan, when: "state.evaluation.verdict == 'retry'" }
  - { from: evaluate, to: blocked, when: "state.evaluation.verdict == 'blocked'" }
  - { from: approve, to: complete, when: "state.evaluation.verdict == 'passed'" }
  - { from: approve, to: plan, when: "state.evaluation.verdict == 'retry'" }
  - { from: approve, to: blocked, when: "state.evaluation.verdict == 'blocked'" }
terminal:
  - { node: complete, verdict: passed }
  - { node: blocked, verdict: blocked }
