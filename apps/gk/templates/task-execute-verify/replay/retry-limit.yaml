name: retry-limit
inputs: { task: task-1, objective: fail safely }
overrides:
  load-context: { summary: [{ id: ctx, task: load }] }
  plan: { summary: [{ id: impl, task: implement }] }
  implement: { summary: attempted, evidence: [{ key: tests, value: fail }] }
